version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: postgres_bacen

    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: bacen

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:

    image: dpage/pgadmin4

    container_name: pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "8080:80"

    depends_on:
      - postgres

  hop:

    image: apache/hop:latest

    container_name: apache_hop

    ports:
      - "8082:8080"

    volumes:

      - ./data:/files

      - ./hop/projects:/project

      - ./hop/pipelines:/pipelines

    depends_on:

      - postgres

volumes:

  postgres_data: